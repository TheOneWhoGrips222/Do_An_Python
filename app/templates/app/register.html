<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="logo">Q&A Stack</a>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Đăng ký</h2>

            <form action="" method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập..." required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password1" class="form-control" placeholder="Tạo mật khẩu..." required>
                </div>

                <div class="form-group">
                    <label>Nhập lại mật khẩu</label>
                    <input type="password" name="password2" class="form-control" placeholder="Xác nhận mật khẩu..." required>
                </div>

                {% if form.errors %}
                    <div style="color: red; margin-bottom: 10px;">
                        {% for field, errors in form.errors.items %}
                            {% for error in errors %}
                                <p>{{ error }}</p>
                            {% endfor %}
                        {% endfor %}
                    </div>
                {% endif %}

                <button type="submit" class="btn-auth">Tạo tài khoản</button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a>
            </div>
        </div>
    </div>
</body>
</html>
