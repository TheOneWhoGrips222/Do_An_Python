<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - DevCommunity</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
</head>
<body>

    <div class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="logo">
                <i class="fas fa-code" style="color: #f48225;"></i> DevCommunity
            </a>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Đăng ký</h2>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div style="background-color: #ffebee; border: 1px solid #ef9a9a; color: #c62828; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: left; font-size: 0.9rem;">
                        <strong>Đã có lỗi xảy ra:</strong>
                        <ul style="margin-top: 5px; padding-left: 20px;">
                            {% for field in form %}
                                {% for error in field.errors %}
                                    <li>{{ field.label }}: {{ error }}</li>
                                {% endfor %}
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="nhapemail@gmail.com" value="{{ form.email.value|default:'' }}">
                </div>

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" required placeholder="Nhập tên đăng nhập..." value="{{ form.username.value|default:'' }}">
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password1" class="form-control" required placeholder="Tạo mật khẩu...">
                </div>

                <div class="form-group">
                    <label>Nhập lại mật khẩu</label>
                    <input type="password" name="password2" class="form-control" required placeholder="Xác nhận mật khẩu...">
                </div>

                <button type="submit" class="btn-auth">Tạo tài khoản</button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a>
            </div>
        </div>
    </div>

</body>
</html>
