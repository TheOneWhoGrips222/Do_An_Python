<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thành công - DevCommunity</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="logo">DevCommunity</a>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div style="color: #2e7d32; font-size: 3rem; margin-bottom: 10px;">
                <i class="fas fa-check-circle"></i> ✓
            </div>
            <h2 class="auth-title">Đổi mật khẩu thành công!</h2>

            <p style="margin-bottom: 30px; color: #333;">
                Mật khẩu của bạn đã được cập nhật. Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.
            </p>

            <a href="{% url 'login' %}" class="btn-auth" style="display: inline-block; text-decoration: none; line-height: 1.2;">
                Đăng nhập ngay
            </a>
        </div>
    </div>
</body>
</html>
