<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - DevCommunity</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="logo">DevCommunity</a>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Đặt lại mật khẩu</h2>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">
                Nhập địa chỉ email bạn đã dùng để đăng ký. Chúng tôi sẽ gửi cho bạn một liên kết để tạo mật khẩu mới.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Địa chỉ Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="vidu@gmail.com">
                </div>
                <button type="submit" class="btn-auth">Gửi yêu cầu</button>
            </form>
        </div>
    </div>
</body>
</html>
